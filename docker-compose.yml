# CPP Sales Hub — runs the hub, its server and its database.
# Start:  docker compose up -d --build      Stop:  docker compose down
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hub
      POSTGRES_DB: hub
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - hub-database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: ./app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://hub:${DB_PASSWORD}@db:5432/hub
    ports:
      - "${HUB_PORT:-8080}:8080"
    volumes:
      - hub-files:/data/files
    depends_on:
      db:
        condition: service_healthy

volumes:
  hub-database:
  hub-files:
